apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  labels:
    app: postgres-deployment
    tier: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
        tier: database
    spec:
      containers:
        - name: postgres-deployment
          image: 'postgres:16'
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: hospital
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: hms-db-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hms-db-credentials
                  key: password
          ports:
            - containerPort: 5432
              name: postgresql
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgresql-claim0
      volumes:
        - name: postgresql-claim0
          persistentVolumeClaim:
            claimName: postgres-volume-claim