apiVersion: apps/v1
kind: Deployment
metadata:
  name: hms-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hms-svc
  template:
    metadata:
      labels:
        app: hms-svc
    spec:
      containers:
        - image: martinstefanov20/hms-martin:df9b5c2add4f4f250f12e4350aa8f898c5179002
          name: hms-svc
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgresql:5432/hospital
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hms-db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hms-db-credentials
                  key: password
            - name: DEMO_RESET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hms-db-credentials
                  key: demo-reset-token
                  optional: true
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
