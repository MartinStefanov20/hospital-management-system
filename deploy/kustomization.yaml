apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local cluster (kind / minikube): in-cluster PostgreSQL + the application.
#   kubectl create secret generic hms-db-credentials ...   (see k8s/secret.example.yaml)
#   kubectl apply -k deploy/
# Production runs on Cloud Run instead (docs/DEPLOY.md). The manifests live in k8s/ so that
# `kubeconform -strict deploy/k8s` validates only real Kubernetes resources.

resources:
  - k8s/postgres-pv.yaml
  - k8s/postgres-pvc.yaml
  - k8s/postgres-deployment.yaml
  - k8s/postgres-service.yaml
  - k8s/deployment.yaml
  - k8s/service.yaml
