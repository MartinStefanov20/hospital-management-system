apiVersion: apps/v1
kind: Deployment
metadata:
  name: hms
  labels:
    app: hms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hms
  template:
    metadata:
      labels:
        app: hms
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hms
          # Image built by .github/workflows/ci.yml (docker build) / deploy-cloud-run.yml.
          # Alternatively use the Artifact Registry path:
          #   europe-west3-docker.pkg.dev/<GCP_PROJECT>/apps/hospital-ms:<git-sha>
          image: ghcr.io/martinstefanov20/hospital-management-system:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: demo
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgresql:5432/hospital
          envFrom:
            # keys: SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD, DEMO_RESET_TOKEN (see secret.example.yaml)
            - secretRef:
                name: hms-db-credentials
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
