# Example only - not part of the kustomization. Create the real Secret out-of-band, e.g.:
#   kubectl create secret generic hms-db-credentials \
#     --from-literal=POSTGRES_USER=postgres \
#     --from-literal=POSTGRES_PASSWORD='<real-password>' \
#     --from-literal=SPRING_DATASOURCE_USERNAME=postgres \
#     --from-literal=SPRING_DATASOURCE_PASSWORD='<real-password>' \
#     --from-literal=DEMO_RESET_TOKEN='<random-token>'
apiVersion: v1
kind: Secret
metadata:
  name: hms-db-credentials
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: change-me
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: change-me
  DEMO_RESET_TOKEN: change-me
